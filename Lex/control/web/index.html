<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lex HQ — Control Center</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a313c;
    --txt:#e6edf3; --dim:#8b95a1; --accent:#4f9dff; --accent2:#7c5cff;
    --ok:#3fb950; --warn:#e3b341; --bad:#f85149; --blocked:#e3b341;
    --chip:#222b38;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(90deg,#12161d,#171d29);
    position:sticky;top:0;z-index:5}
  .logo{font-weight:700;font-size:17px;letter-spacing:.3px}
  .logo b{color:var(--accent)}
  .pill{font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:20px;padding:3px 10px}
  .pill.alert{color:#111;background:var(--warn);border-color:var(--warn);font-weight:600}
  .spacer{flex:1}
  .muted{color:var(--dim)}
  main{max-width:1200px;margin:0 auto;padding:18px 20px;
    display:grid;grid-template-columns:1fr 340px;gap:18px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:18px}
  h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--dim);display:flex;align-items:center;gap:8px}
  h2 .n{background:var(--chip);color:var(--txt);border-radius:20px;
    padding:1px 9px;font-size:12px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;margin-bottom:11px}
  .card.gate{border-color:#5a4a1e;background:linear-gradient(180deg,#211d10,#1b1a14)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .title{font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);
    color:var(--dim);border:1px solid var(--line);white-space:nowrap}
  .chip.s-inbox{color:#c9d1d9}
  .chip.s-queued{color:var(--accent);border-color:#294066}
  .chip.s-running{color:#111;background:var(--accent);font-weight:600}
  .chip.s-blocked{color:#111;background:var(--blocked);font-weight:600}
  .chip.s-done{color:var(--ok);border-color:#20401f}
  .chip.s-failed{color:var(--bad);border-color:#4a2020}
  .chip.hi{color:#111;background:var(--bad);font-weight:600}
  .detail{color:#c9d1d9;margin:4px 0 2px;white-space:pre-wrap}
  pre.preview{background:#0b0f16;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;white-space:pre-wrap;max-height:230px;overflow:auto;
    font:12.5px/1.5 "Cascadia Code",Consolas,monospace;color:#cbd5e1}
  button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--txt);
    border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:#3d4757}
  button.ok{background:var(--ok);border-color:var(--ok);color:#06210b;font-weight:600}
  button.bad{background:transparent;border-color:#5a2626;color:#f19b96}
  button.pri{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:600}
  .acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  input,select,textarea{width:100%;background:#0b0f16;border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
  .agent{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .agent:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 3px rgba(63,185,80,.15)}
  .agent .role{color:var(--dim);font-size:12px}
  .feed{max-height:420px;overflow:auto}
  .ev{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ev:last-child{border-bottom:0}
  .ev .t{color:var(--dim);font-size:11px;white-space:nowrap;min-width:74px}
  .ev .who{font-weight:600}
  .ev.approval .who{color:var(--warn)} .ev.error .who{color:var(--bad)}
  .ev.task .who{color:var(--accent)}
  .empty{color:var(--dim);font-style:italic;padding:6px 0}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;opacity:0;
    transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo"><b>Lex</b> HQ · Control Center</div>
  <span class="pill" id="p-open">— open</span>
  <span class="pill alert" id="p-appr" style="display:none"></span>
  <div class="spacer"></div>
  <span class="pill muted" id="clock">—</span>
</header>

<main>
  <div class="col-main">
    <section id="approvals-wrap" style="display:none">
      <h2>⏳ Awaiting your approval <span class="n" id="appr-n">0</span></h2>
      <div id="approvals"></div>
    </section>

    <section>
      <h2>➕ Assign a task</h2>
      <div class="row"><input id="f-title" placeholder="What should Lex do? (e.g. Prepare Wave-2 follow-ups for Tedt)"></div>
      <label>Details / context (optional)</label>
      <textarea id="f-detail" placeholder="Any specifics, targets, constraints…"></textarea>
      <div class="grid2">
        <div><label>Project</label>
          <select id="f-project"><option value="">— none —</option><option value="tedt">Tedt</option></select></div>
        <div><label>Assign to</label>
          <select id="f-assignee">
            <option value="auto">Auto (Lex decides)</option>
            <option value="lex">Lex (head)</option>
            <option value="scout">Scout — research/scrape</option>
            <option value="herald">Herald — email/outreach</option>
          </select></div>
      </div>
      <div class="grid2" style="margin-top:4px">
        <div><label>Priority</label>
          <select id="f-priority"><option value="normal">Normal</option><option value="high">High</option></select></div>
        <div style="display:flex;align-items:flex-end;gap:8px">
          <button class="pri" onclick="createTask(true)">Create &amp; Start ▶</button>
          <button onclick="createTask(false)">Add to inbox</button>
        </div>
      </div>
    </section>

    <section>
      <h2>🗂 Tasks <span class="n" id="task-n">0</span></h2>
      <div id="tasks"></div>
    </section>
  </div>

  <div class="col-side">
    <section>
      <h2>🤖 Agents</h2>
      <div id="agents"></div>
    </section>
    <section>
      <h2>📡 Activity</h2>
      <div class="feed" id="activity"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const timeShort = iso => { if(!iso) return ""; const d=new Date(iso.replace(" ","T"));
  return isNaN(d)? iso : d.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };

async function api(path, method="GET", body){
  const r = await fetch(path,{method,headers:{"Content-Type":"application/json"},
    body: body?JSON.stringify(body):undefined});
  return r.json();
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800); }

async function createTask(start){
  const title=$("#f-title").value.trim();
  if(!title){ toast("Give the task a title"); return; }
  await api("/api/tasks","POST",{title, detail:$("#f-detail").value,
    project:$("#f-project").value, assignee:$("#f-assignee").value,
    priority:$("#f-priority").value, start});
  $("#f-title").value=""; $("#f-detail").value="";
  toast(start?"Task created & started":"Task added to inbox");
  refresh();
}
async function taskAction(id,action){ await api("/api/task/"+id,"POST",{action}); refresh(); }
async function decide(id,decision){
  let note="";
  if(decision==="reject"){ note = prompt("Reason / change request (optional):")||""; }
  await api("/api/approval/"+id,"POST",{decision,note});
  toast(decision==="approve"?"Approved":"Rejected"); refresh();
}

function taskCard(t){
  const st=esc(t.status);
  const chips=[`<span class="chip s-${st}">${st}</span>`,
    `<span class="chip">@${esc(t.assignee)}</span>`,
    t.project?`<span class="chip">#${esc(t.project)}</span>`:"",
    t.priority==="high"?`<span class="chip hi">high</span>`:""].join("");
  const last=(t.updates||[]).slice(-1)[0];
  const acts=[];
  if(t.status==="inbox") acts.push(`<button class="pri" onclick="taskAction('${t.id}','start')">Start ▶</button>`);
  if(["queued","running","blocked"].includes(t.status)) acts.push(`<button class="ok" onclick="taskAction('${t.id}','complete')">Mark done</button>`);
  if(t.status!=="done"&&t.status!=="failed") acts.push(`<button class="bad" onclick="taskAction('${t.id}','cancel')">Cancel</button>`);
  return `<div class="card"><div class="row"><span class="title">${esc(t.title)}</span></div>
    <div class="chips">${chips}</div>
    ${t.detail?`<div class="detail muted">${esc(t.detail)}</div>`:""}
    ${last?`<div class="muted" style="font-size:12px">↳ ${esc(last.text)} · ${timeShort(last.at)}</div>`:""}
    ${t.result?`<div class="detail">✅ ${esc(t.result)}</div>`:""}
    <div class="acts">${acts.join("")}</div></div>`;
}
function approvalCard(a){
  return `<div class="card gate">
    <div class="row"><span class="title">🔐 ${esc(a.title)}</span>
      <span class="chip">@${esc(a.agent)}</span><span class="chip">${esc(a.action)}</span></div>
    ${a.summary?`<div class="detail">${esc(a.summary)}</div>`:""}
    ${a.preview?`<pre class="preview">${esc(a.preview)}</pre>`:""}
    <div class="acts">
      <button class="ok" onclick="decide('${a.id}','approve')">✔ Approve</button>
      <button class="bad" onclick="decide('${a.id}','reject')">✖ Reject / revise</button>
    </div></div>`;
}
function agentRow(a){
  return `<div class="agent"><span class="dot"></span>
    <div><div class="title">${esc(a.name)} <span class="muted" style="font-size:11px">${esc(a.tag||"")}</span></div>
    <div class="role">${esc(a.role)}</div></div></div>`;
}
function evRow(e){
  return `<div class="ev ${esc(e.type)}"><span class="t">${timeShort(e.at)}</span>
    <span><span class="who">${esc(e.agent)}</span> ${esc(e.text)}</span></div>`;
}

async function refresh(){
  let s; try{ s=await api("/api/state"); }catch(e){ return; }
  $("#clock").textContent = "updated "+timeShort(s.meta.now);
  const pa=s.meta.counts.pendingApprovals, ot=s.meta.counts.openTasks;
  $("#p-open").textContent = ot+" open";
  const pApr=$("#p-appr");
  if(pa>0){ pApr.style.display=""; pApr.textContent = pa+" need approval"; }
  else pApr.style.display="none";

  const pend = s.approvals.filter(a=>a.status==="pending");
  $("#approvals-wrap").style.display = pend.length? "" : "none";
  $("#appr-n").textContent = pend.length;
  $("#approvals").innerHTML = pend.map(approvalCard).join("");

  $("#task-n").textContent = s.tasks.length;
  $("#tasks").innerHTML = s.tasks.length? s.tasks.map(taskCard).join("")
    : `<div class="empty">No tasks yet — assign one above.</div>`;

  $("#agents").innerHTML = s.agents.length? s.agents.map(agentRow).join("")
    : `<div class="empty">No agents registered.</div>`;
  $("#activity").innerHTML = s.activity.length? s.activity.map(evRow).join("")
    : `<div class="empty">No activity yet.</div>`;
}
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
